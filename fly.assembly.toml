# Fly app for ranking FFmpeg assembly workers
# Deploy: fly apps create viewhunt-assembly && fly deploy -c fly.assembly.toml --build-only
# Then set FLY_ASSEMBLY_IMAGE to the resulting image ref on the DO app.

app = 'viewhunt-assembly'
primary_region = 'iad'

[build]
  dockerfile = 'server/workers/assembly/Dockerfile'

[env]
  NODE_ENV = 'production'

# Machines are created on-demand via API; no always-on service needed.
[http_service]
  auto_stop_machines = 'stop'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'

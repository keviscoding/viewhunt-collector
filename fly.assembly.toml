# Fly app for ranking FFmpeg assembly workers.
# Deploy image only (no always-on VM):
#   fly deploy -c fly.assembly.toml --build-only --push
# Then set FLY_ASSEMBLY_IMAGE on DigitalOcean to the printed registry ref.
# Machines are created on-demand via the Machines API with JOB_ID set.

app = 'viewhunt-assembly'
primary_region = 'iad'

[build]
  dockerfile = 'server/workers/assembly/Dockerfile'

[env]
  NODE_ENV = 'production'

# No [http_service] — this is not a public web app. Avoid always-on machines
# that crash-loop without JOB_ID.

[[vm]]
  size = 'shared-cpu-4x'
  memory = '4gb'

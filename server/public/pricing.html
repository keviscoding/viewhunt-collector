<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewHunt — Pricing</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" href="/images/viewhunt_logo.png">
    <link rel="apple-touch-icon" href="/images/viewhunt_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0e0e12;--surface:#18181f;--surface-2:#1f1f28;--border:#2a2a36;
            --text:#e8e8ed;--text-muted:#8b8b9e;--text-dim:#5c5c6e;
            --accent:#7c6aef;--accent-hover:#6b58e0;--accent-glow:rgba(124,106,239,0.15);
            --green:#34d399;--green-dim:rgba(52,211,153,0.12);
            --amber:#fbbf24;--red:#f87171;
        }
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
        .page{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 4rem}
        .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:3rem}
        .nav-logo{font-size:1.3rem;font-weight:800;color:var(--text);text-decoration:none;letter-spacing:-0.02em}
        .nav-logo span{color:var(--accent)}
        .nav-links{display:flex;gap:1rem;align-items:center}
        .nav-links a{color:var(--text-muted);text-decoration:none;font-size:0.85rem;font-weight:500;transition:color 0.15s}
        .nav-links a:hover{color:var(--text)}
        .hero{text-align:center;margin-bottom:3rem}
        .hero h1{font-size:2.2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.75rem}
        .hero h1 em{color:var(--accent);font-style:normal}
        .hero p{color:var(--text-muted);font-size:1.05rem;max-width:560px;margin:0 auto;line-height:1.6}
</style>
</head>
<body>
<div class="page">
    <nav class="nav">
        <a href="/" class="nav-logo">View<span>Hunt</span></a>
        <div class="nav-links">
            <a href="/app">Dashboard</a>
            <a href="/studio/v2.html">Studio</a>
        </div>
    </nav>
    <div class="hero">
        <h1>Simple, transparent <em>pricing</em></h1>
        <p>Find viral niches with ViewHunt. Create scroll-stopping videos with Content Studio. One subscription, everything included.</p>
    </div>
    <div id="plans"></div>
    <div id="topups"></div>
    <div id="features"></div>
</div>
</body>
</html>

<style>
    .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-bottom:3rem}
    .plan{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.75rem;position:relative;transition:border-color 0.2s,transform 0.2s}
    .plan:hover{border-color:var(--accent);transform:translateY(-2px)}
    .plan.pop{border-color:var(--accent);box-shadow:0 0 30px var(--accent-glow)}
    .plan-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;font-size:0.72rem;font-weight:700;padding:0.2rem 0.75rem;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em}
    .plan-name{font-size:1.1rem;font-weight:700;margin-bottom:0.25rem}
    .plan-price{font-size:2.2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.15rem}
    .plan-price span{font-size:0.9rem;font-weight:500;color:var(--text-muted)}
    .plan-credits{font-size:0.9rem;color:var(--accent);font-weight:600;margin-bottom:0.15rem}
    .plan-videos{font-size:0.8rem;color:var(--text-dim);margin-bottom:1rem}
    .plan-features{list-style:none;margin-bottom:1.5rem}
    .plan-features li{font-size:0.85rem;color:var(--text-muted);padding:0.35rem 0;display:flex;align-items:flex-start;gap:0.5rem;line-height:1.4}
    .plan-features li::before{content:'✓';color:var(--green);font-weight:700;flex-shrink:0}
    .plan-btn{display:block;width:100%;padding:0.75rem;border:none;border-radius:10px;font-weight:700;font-size:0.95rem;cursor:pointer;font-family:inherit;transition:all 0.15s;text-align:center}
    .plan-btn-primary{background:var(--accent);color:white}
    .plan-btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 16px var(--accent-glow)}
    .plan-btn-secondary{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}
    .plan-btn-secondary:hover{color:var(--text);border-color:var(--accent)}

    .topup-section{text-align:center;margin-bottom:3rem}
    .topup-section h2{font-size:1.4rem;font-weight:700;margin-bottom:0.4rem}
    .topup-section p{color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem}
    .topup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:720px;margin:0 auto}
    .topup-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;position:relative;transition:border-color 0.2s,transform 0.2s}
    .topup-card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .topup-card.best{border-color:var(--green)}
    .topup-badge{position:absolute;top:-10px;right:12px;background:var(--green);color:#0e0e12;font-size:0.68rem;font-weight:700;padding:0.15rem 0.6rem;border-radius:12px;text-transform:uppercase}
    .topup-credits{font-size:1.3rem;font-weight:800;margin-bottom:0.15rem}
    .topup-videos{font-size:0.8rem;color:var(--text-dim);margin-bottom:0.75rem}
    .topup-price{display:flex;align-items:center;gap:0.5rem;justify-content:center;margin-bottom:0.15rem}
    .topup-was{font-size:0.95rem;color:var(--text-dim);text-decoration:line-through}
    .topup-now{font-size:1.5rem;font-weight:800;color:var(--text)}
    .topup-discount{background:var(--green-dim);color:var(--green);font-size:0.7rem;font-weight:700;padding:0.15rem 0.4rem;border-radius:6px}
    .topup-per{font-size:0.75rem;color:var(--text-dim);margin-bottom:1rem}
    .topup-btn{display:block;width:100%;padding:0.6rem;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text-muted);font-weight:600;font-size:0.85rem;cursor:pointer;font-family:inherit;transition:all 0.15s}
    .topup-btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-glow)}

    .features-section{text-align:center;margin-bottom:2rem}
    .features-section h2{font-size:1.4rem;font-weight:700;margin-bottom:0.5rem}
    .features-section>p{color:var(--text-muted);font-size:0.9rem;margin-bottom:2rem}
    .features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
    .feature-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;text-align:left}
    .feature-card .icon{font-size:1.5rem;margin-bottom:0.5rem}
    .feature-card h3{font-size:0.95rem;font-weight:700;margin-bottom:0.25rem}
    .feature-card p{font-size:0.82rem;color:var(--text-muted);line-height:1.5}
    .cost-table{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;max-width:400px;margin:0 auto}
    .cost-table h3{font-size:0.95rem;font-weight:700;margin-bottom:0.75rem;text-align:center}
    .cost-row{display:flex;justify-content:space-between;padding:0.4rem 0;font-size:0.85rem;border-bottom:1px solid var(--border)}
    .cost-row:last-child{border-bottom:none}
    .cost-row span:last-child{color:var(--accent);font-weight:600}
    @media(max-width:768px){.plans,.topup-grid,.features-grid{grid-template-columns:1fr}}
</style>

<script>
function getAuthToken(){
    return localStorage.getItem('viewhunt_token')||localStorage.getItem('token')||
        (document.cookie.split(';').find(function(c){return c.trim().startsWith('token=')})||'').split('=')[1]||null;
}

(function(){
    // === PLANS ===
    var plans=[
        {id:'starter',name:'Starter',price:'$29',credits:'300',pop:false,content:'~4 min of finished content',features:[
            'ViewHunt Niche Database (unlimited)',
            '300 video credits per month',
            '~4 full videos per month (~48 scene clips)',
            'All video formats & styles',
            'Custom SFX & background music',
            'Word-by-word captions'
        ]},
        {id:'creator',name:'Creator',price:'$59',credits:'600',pop:true,content:'~8 min of finished content',features:[
            'ViewHunt Niche Database (unlimited)',
            '600 video credits per month',
            '~8 full videos per month (~96 scene clips)',
            'All video formats & styles',
            'Custom SFX & background music',
            'Word-by-word captions',
            'Priority generation queue'
        ]},
        {id:'studio',name:'Studio',price:'$119',credits:'1,200',pop:false,content:'~16 min of finished content',features:[
            'ViewHunt Niche Database (unlimited)',
            '1,200 video credits per month',
            '~16 full videos per month (~192 scene clips)',
            'All video formats & styles',
            'Custom SFX & background music',
            'Word-by-word captions',
            'Priority generation queue',
            'Best top-up rates'
        ]}
    ];

    var h='<div class="plans">';
    plans.forEach(function(p){
        h+='<div class="plan'+(p.pop?' pop':'')+'">';
        if(p.pop) h+='<div class="plan-badge">Most Popular</div>';
        h+='<div class="plan-name">'+p.name+'</div>';
        h+='<div class="plan-price">'+p.price+' <span>/month</span></div>';
        h+='<div class="plan-credits">💎 '+p.credits+' credits/month</div>';
        if(p.content) h+='<div class="plan-videos">📹 '+p.content+'</div>';
        h+='<ul class="plan-features">';
        p.features.forEach(function(f){h+='<li>'+f+'</li>'});
        h+='</ul>';
        h+='<button class="plan-btn '+(p.pop?'plan-btn-primary':'plan-btn-secondary')+'" onclick="subscribe(\''+p.id+'\')">Get '+p.name+'</button>';
        h+='</div>';
    });
    h+='</div>';
    document.getElementById('plans').innerHTML=h;

    // === TOP-UPS ===
    var packs=[
        {id:'small',credits:'200',videos:'~36 scene clips · ~3 min of content',was:'$30',now:'$19.99',discount:'-33%',per:'$0.10/credit',best:false},
        {id:'medium',credits:'500',videos:'~90 scene clips · ~7 min of content',was:'$70',now:'$49.99',discount:'-29%',per:'$0.10/credit',best:false},
        {id:'large',credits:'1,200',videos:'~218 scene clips · ~18 min of content',was:'$140',now:'$99.99',discount:'-29%',per:'$0.083/credit',best:true}
    ];

    var t='<div class="topup-section"><h2>🔋 Need more credits?</h2><p>Buy a top-up pack anytime. Top-up credits never expire.</p><div class="topup-grid">';
    packs.forEach(function(p){
        t+='<div class="topup-card'+(p.best?' best':'')+'">';
        if(p.best) t+='<div class="topup-badge">Best Value</div>';
        t+='<div class="topup-credits">'+p.credits+' Credits</div>';
        t+='<div class="topup-videos">'+p.videos+'</div>';
        t+='<div class="topup-price"><span class="topup-discount">'+p.discount+'</span> <span class="topup-was">'+p.was+'</span> <span class="topup-now">'+p.now+'</span></div>';
        t+='<div class="topup-per">'+p.per+'</div>';
        t+='<button class="topup-btn" onclick="buyPack(\''+p.id+'\')">Purchase</button>';
        t+='</div>';
    });
    t+='</div></div>';
    document.getElementById('topups').innerHTML=t;

    // === FEATURES ===
    var f='<div class="features-section"><h2>Everything you need to go viral</h2><p>ViewHunt finds the niches. Content Studio creates the videos. You post and grow.</p>';
    f+='<div class="features-grid">';
    f+='<div class="feature-card"><div class="icon">🔍</div><h3>Niche Discovery</h3><p>Browse thousands of profitable YouTube Shorts niches with real performance data. Unlimited on all plans.</p></div>';
    f+='<div class="feature-card"><div class="icon">🎬</div><h3>Content Studio</h3><p>AI video generation. Write a script, pick visuals, get a fully assembled video with voiceover, captions, and SFX.</p></div>';
    f+='<div class="feature-card"><div class="icon">⚡</div><h3>One-Click Assembly</h3><p>Automatic voiceover timing, word-by-word captions, transition effects, and background music. Just hit assemble.</p></div>';
    f+='</div>';
    f+='<div class="cost-table"><h3>💎 Credit Costs Per Action</h3>';
    f+='<div class="cost-row"><span>Script Generation</span><span>5 credits</span></div>';
    f+='<div class="cost-row"><span>Image Generation (per scene)</span><span>0.5 credits</span></div>';
    f+='<div class="cost-row"><span>Video Clip Generation (5s, per scene)</span><span>5 credits</span></div>';
    f+='<div class="cost-row"><span>Final Assembly (voiceover + captions + SFX)</span><span>2 credits</span></div>';
    f+='<div class="cost-row" style="border-top:2px solid var(--border);margin-top:0.25rem;padding-top:0.5rem"><span style="font-weight:700">Full Video (~12 scenes, ~1 min)</span><span style="font-weight:700">~73 credits</span></div>';
    f+='<div style="text-align:center;margin-top:0.75rem;font-size:0.78rem;color:var(--text-dim);line-height:1.5">Each scene = one 5-second AI video clip.<br>A 12-scene video = ~1 minute of finished content.<br>🛡️ Failed generations are never charged.</div>';
    f+='</div></div>';
    document.getElementById('features').innerHTML=f;
})();

async function subscribe(plan){
    var token=getAuthToken();
    if(!token){window.location.href='/app?redirect=pricing';return}
    try{
        var res=await fetch('/api/subscription/create-plan-checkout',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
            body:JSON.stringify({plan:plan})
        });
        var data=await res.json();
        if(data.url) window.location.href=data.url;
        else alert(data.error||'Could not start checkout');
    }catch(err){alert('Error: '+err.message)}
}

async function buyPack(pack){
    var token=getAuthToken();
    if(!token){window.location.href='/app?redirect=pricing';return}
    try{
        var res=await fetch('/api/studio/credits/buy',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
            body:JSON.stringify({pack:pack})
        });
        var data=await res.json();
        if(data.url) window.location.href=data.url;
        else alert(data.error||'Could not start purchase');
    }catch(err){alert('Error: '+err.message)}
}
</script>

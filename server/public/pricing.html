<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewHunt - Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
        }
        .access-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 60px 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .access-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 16px;
        }
        p {
            font-size: 18px;
            margin-bottom: 32px;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            background: white;
            color: #764ba2;
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 18px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }
            .access-card {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">ViewHunt</div>
        <div class="access-card">
            <div class="access-icon">🚀</div>
            <h1>Access ViewHunt</h1>
            <p>Sign in to your ViewHunt account to discover profitable YouTube Shorts niches with advanced data insights.</p>
            <a href="/app" class="btn">Sign In to ViewHunt</a>
        </div>
    </div>

    <script>
        // Auto-redirect to app after 3 seconds if user doesn't click
        setTimeout(() => {
            window.location.href = '/app';
        }, 3000);
    </script>
</body>
</html>

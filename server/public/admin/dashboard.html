<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewHunt Admin Analytics</title>
    <style>
        :root {
            --bg: #0b0b10;
            --surface: #14141c;
            --border: #2a2a38;
            --text: #f3f3f7;
            --dim: #9a9aaf;
            --accent: #7c5cfc;
            --green: #34d399;
            --amber: #fbbf24;
            --red: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
        h1 span { color: var(--accent); }
        .meta { font-size: 0.78rem; color: var(--dim); margin-top: 0.25rem; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .range-btn, .btn {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .range-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: wait; }
        main { padding: 1.25rem 1.5rem 3rem; max-width: 960px; margin: 0 auto; }
        .callout {
            background: rgba(124,92,252,0.12);
            border: 1px solid rgba(124,92,252,0.35);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #ddd6fe;
        }
        .callout strong { color: #fff; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.1rem 1.15rem;
            min-height: 120px;
        }
        .card.primary { border-color: rgba(52,211,153,0.55); box-shadow: 0 0 0 1px rgba(52,211,153,0.15); }
        .card h2 {
            margin: 0 0 0.35rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--dim);
            font-weight: 600;
        }
        .value {
            font-size: 1.85rem;
            font-weight: 750;
            line-height: 1.15;
            margin: 0.35rem 0;
        }
        .sub { font-size: 0.78rem; color: var(--dim); line-height: 1.45; }
        .source {
            display: inline-block;
            margin-top: 0.65rem;
            font-size: 0.68rem;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--dim);
        }
        .source.cloudflare { border-color: rgba(251,191,36,0.45); color: #fcd34d; }
        .source.mongo { border-color: rgba(52,211,153,0.45); color: #6ee7b7; }
        .warn { color: var(--amber); font-size: 0.8rem; }
        .err { color: var(--red); font-size: 0.8rem; }
        .section { margin-top: 1.75rem; }
        .section h3 { font-size: 0.95rem; margin: 0 0 0.75rem; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td { text-align: left; padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); }
        th { color: var(--dim); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; }
        tr:last-child td { border-bottom: none; }
        #gate, #loading { padding: 3rem 1.5rem; text-align: center; color: var(--dim); }
        a.link { color: var(--accent); }
        .spark {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 48px;
            margin-top: 0.75rem;
        }
        .spark i {
            flex: 1;
            background: rgba(124,92,252,0.55);
            border-radius: 2px 2px 0 0;
            min-width: 2px;
        }
    </style>
</head>
<body>
    <div id="gate" style="display:none;">
        <p>Sign in as an admin to view analytics.</p>
        <p><a class="link" href="/app">Go to app login</a></p>
    </div>

    <div id="app" style="display:none;">
        <header>
            <div>
                <h1>ViewHunt <span>Analytics</span></h1>
                <div class="meta" id="meta-line">Loading…</div>
            </div>
            <div class="controls">
                <button type="button" class="range-btn" data-range="7d">7d</button>
                <button type="button" class="range-btn active" data-range="30d">30d</button>
                <button type="button" class="range-btn" data-range="90d">90d</button>
                <button type="button" class="btn btn-primary" id="btn-refresh">Refresh</button>
                <a class="btn" href="/app" style="text-decoration:none;">App</a>
            </div>
        </header>

        <main>
            <div class="callout" id="partner-callout"></div>
            <div id="banner"></div>
            <div class="grid" id="cards"></div>

            <div class="section">
                <h3>What these numbers mean</h3>
                <table>
                    <thead><tr><th>Metric</th><th>Definition</th></tr></thead>
                    <tbody id="def-rows"><tr><td colspan="2">—</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="loading">Checking access…</div>

    <script>
    (function() {
        var token = localStorage.getItem('viewhunt_token') || localStorage.getItem('token');
        var range = '30d';
        var ADMINS = ['nwalikelv@gmail.com', 'kevis@viewhunt.com', 'kevis@keviscoding.com'];

        function $(id) { return document.getElementById(id); }
        function fmt(n) {
            if (n == null || n !== n) return '—';
            return Number(n).toLocaleString();
        }
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showGate() {
            $('loading').style.display = 'none';
            $('app').style.display = 'none';
            $('gate').style.display = '';
        }

        async function checkAdmin() {
            if (!token) { showGate(); return false; }
            try {
                var res = await fetch('/api/auth/me', {
                    headers: { Authorization: 'Bearer ' + token }
                });
                if (!res.ok) { showGate(); return false; }
                var me = await res.json();
                var email = (me.email || '').toLowerCase();
                var ok = ADMINS.indexOf(email) !== -1 ||
                    (me.subscription && me.subscription.type === 'admin');
                if (!ok) { showGate(); return false; }
                $('loading').style.display = 'none';
                $('gate').style.display = 'none';
                $('app').style.display = '';
                return true;
            } catch (e) {
                showGate();
                return false;
            }
        }

        function card(title, value, sub, sourceClass, sourceLabel, primary) {
            return '<div class="card' + (primary ? ' primary' : '') + '">' +
                '<h2>' + title + '</h2>' +
                '<div class="value">' + value + '</div>' +
                (sub ? '<div class="sub">' + sub + '</div>' : '') +
                '<span class="source ' + sourceClass + '">Source: ' + sourceLabel + '</span>' +
                '</div>';
        }

        function spark(series) {
            if (!series || !series.length) return '';
            var max = 1;
            series.forEach(function(p) { if ((p.pageViews || 0) > max) max = p.pageViews; });
            return '<div class="spark" title="Daily page views">' +
                series.map(function(p) {
                    var h = Math.max(2, Math.round(((p.pageViews || 0) / max) * 48));
                    var tip = (p.date || '') + ': ' + (p.pageViews || 0) + ' views';
                    return '<i style="height:' + h + 'px" title="' + tip + '"></i>';
                }).join('') + '</div>';
        }

        function render(data) {
            var v = data.visits || {};
            var t = data.trials || {};

            $('partner-callout').innerHTML =
                '<strong>Visits + trials only</strong><br>' +
                'Window from ' + new Date(data.partnerStart).toLocaleDateString() +
                ' · No revenue numbers on this page. Use page views for traffic trend, and the trial cards for free-challenge / card-trial status.';

            var banner = '';
            if (v.error) banner += '<p class="warn">Visits: ' + escapeHtml(v.error) + '</p>';
            if (t.error) banner += '<p class="err">Trials: ' + escapeHtml(t.error) + '</p>';
            $('banner').innerHTML = banner;

            $('meta-line').textContent =
                'Range ' + data.range + ' · ' +
                new Date(data.rangeStart).toLocaleDateString() + ' – ' +
                new Date(data.rangeEnd).toLocaleDateString() +
                (data.clampedToPartnerStart ? ' (from partnership start)' : '') +
                ' · Updated ' + new Date(data.asOf).toLocaleString() +
                (data.cached ? ' (cached)' : ' (fresh)');

            var visitsVal = v.configured === false || v.pageViews == null ? '—' : fmt(v.pageViews);
            var visitsSub = v.configured === false
                ? 'Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ZONE_ID on DigitalOcean'
                : (fmt(v.requests) + ' requests · daily-uniques sum ' + fmt(v.uniqueVisitorsSum) +
                    ' (not period-unique)') +
                  spark(v.series);

            var buckets = t.rankingVideosLeftAmongActive || {};
            var bucketSub = 'Among active: ' +
                fmt(buckets['3']) + ' with 3 left · ' +
                fmt(buckets['2']) + ' with 2 · ' +
                fmt(buckets['1']) + ' with 1 · ' +
                fmt(buckets['0']) + ' with 0';

            var html = '';
            html += card(
                'Page views (range)',
                visitsVal,
                visitsSub,
                'cloudflare', 'Cloudflare', true
            );
            html += card(
                'App free challenge active now',
                t.appTrialActiveNow == null ? '—' : fmt(t.appTrialActiveNow),
                bucketSub,
                'mongo', 'ViewHunt users'
            );
            html += card(
                'Stripe card trials now',
                t.stripeCardTrialNow == null ? '—' : fmt(t.stripeCardTrialNow),
                fmt(t.bothNow) + ' also still have free ranking left',
                'mongo', 'ViewHunt users'
            );
            html += card(
                'App trials started (range)',
                t.appTrialsStartedInRange == null ? '—' : fmt(t.appTrialsStartedInRange),
                'Card trials started in range: ' + fmt(t.stripeCardTrialsStartedInRange),
                'mongo', 'ViewHunt users'
            );
            html += card(
                'Challenge ended (all time)',
                t.appTrialExhausted == null && t.appTrialExpired == null
                    ? '—'
                    : fmt((t.appTrialExhausted || 0) + (t.appTrialExpired || 0)),
                fmt(t.appTrialExhausted) + ' videos/time exhausted · ' +
                    fmt(t.appTrialExpired) + ' expired · ' +
                    fmt(t.appTrialConverted) + ' converted to paid',
                'mongo', 'ViewHunt users'
            );
            $('cards').innerHTML = html;

            var defs = [
                ['Page views', 'Cloudflare page views for viewhunt.app in the selected range (best traffic trend).'],
                ['App free challenge active', 'Users who can still cook free ranking videos (7 days or 3 videos).'],
                ['Stripe card trials', 'Users with a card on file still in Stripe trialing (not billed yet).'],
                ['Both', 'Has a Stripe card trial and still has free ranking allotment left.'],
                ['Started in range', 'App trial.startedAt (or Stripe sub start) falls inside the selected dates.'],
                ['Daily-uniques sum', 'Cloudflare daily uniques added up — return visitors are counted each day, so it is not a period unique.']
            ];
            $('def-rows').innerHTML = defs.map(function(row) {
                return '<tr><td>' + escapeHtml(row[0]) + '</td><td>' + escapeHtml(row[1]) + '</td></tr>';
            }).join('');
        }

        async function load(refresh) {
            var btn = $('btn-refresh');
            btn.disabled = true;
            btn.textContent = 'Loading…';
            try {
                var url = '/api/admin/analytics?range=' + encodeURIComponent(range) +
                    (refresh ? '&refresh=1' : '');
                var res = await fetch(url, {
                    headers: { Authorization: 'Bearer ' + token }
                });
                var data = await res.json();
                if (res.status === 403) { showGate(); return; }
                if (!res.ok) throw new Error(data.error || 'Failed to load');
                render(data);
            } catch (e) {
                $('banner').innerHTML = '<p class="err">' + escapeHtml(e.message) + '</p>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Refresh';
            }
        }

        document.querySelectorAll('.range-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                range = btn.getAttribute('data-range');
                document.querySelectorAll('.range-btn').forEach(function(b) {
                    b.classList.toggle('active', b === btn);
                });
                load(false);
            });
        });
        $('btn-refresh').addEventListener('click', function() { load(true); });

        checkAdmin().then(function(ok) { if (ok) load(true); });
    })();
    </script>
</body>
</html>

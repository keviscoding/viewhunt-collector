# Fly app for autonomous YouTube Shorts scraping (Puppeteer)
app = 'viewhunt-scraper'
primary_region = 'iad'

[build]
  dockerfile = 'server/workers/scraper/Dockerfile'

[env]
  NODE_ENV = 'production'

[http_service]
  auto_stop_machines = 'stop'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
